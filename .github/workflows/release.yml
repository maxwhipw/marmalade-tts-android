name: Release

# Push an annotated tag like `v1.0.0-beta.2` and this builds the signed
# release artifacts, attaches them to the matching GitHub Release, and
# walks away. See docs/release/CI-SIGNING.md for the one-time secret
# setup.
#
# Concurrency: each tag gets its own run; never cancel an in-flight tag
# build (we'd lose the signed AAB).

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # creating/updating the GitHub Release attaches artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          # `submodules: recursive` pulls third_party/espeak-ng — without
          # it the native build can't find the espeak source tree and the
          # APK ships without libespeak-ng.so, which would make every
          # direct engine fail to load on first synth.
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # NDK + CMake versions track the ones pinned in app/build.gradle.kts.
      # Keep them in lockstep — Gradle will fail if it can't find an exact
      # match for `ndkVersion`.
      - name: Install NDK r26d and CMake 3.22.1
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Restore upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "UPLOAD_KEYSTORE_BASE64 secret is missing." >&2
            echo "See docs/release/CI-SIGNING.md for setup." >&2
            exit 1
          fi
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          # Sanity check — keytool exits non-zero on a corrupted/wrong-password
          # keystore, surfacing the misconfig before gradle wastes 5 minutes.
          # Secret passed via env (not templated into the run-line) so a
          # password containing shell metachars stays inert.
          keytool -list -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass:env KEYSTORE_PASSWORD >/dev/null

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          umask 077
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed Play AAB + Play APK + F-Droid APK
        # Play AAB is what gets uploaded to the Console; Play APK is
        # the sideload artifact; F-Droid APK is the fdroid flavor
        # (differs from Play only by the GitHub Sponsors link — both
        # flavors are fully free), attached to the GitHub release for
        # sideloaders/Obtainium and as the reproducible-build reference
        # binary for F-Droid.
        run: >-
          ./gradlew --no-daemon
          :app:bundlePlayRelease
          :app:assemblePlayRelease
          :app:assembleFdroidRelease

      - name: Stage release artifacts
        id: stage
        env:
          # GITHUB_REF_NAME is set by the runner; the `on: tags: ['v*']`
          # filter already gates this, but we re-validate the format
          # explicitly here so a future workflow change can't accidentally
          # let untrusted ref names land in the file paths below.
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          case "$REF_NAME" in
            v[0-9]*) ;;
            *) echo "refusing to release on non-v tag: $REF_NAME" >&2; exit 1 ;;
          esac
          VERSION="${REF_NAME#v}"
          mkdir -p release-artifacts
          cp app/build/outputs/bundle/playRelease/app-play-release.aab \
             "release-artifacts/marmalade-tts-${VERSION}-play.aab"
          cp app/build/outputs/apk/play/release/app-play-release.apk \
             "release-artifacts/marmalade-tts-${VERSION}-play.apk"
          cp app/build/outputs/apk/fdroid/release/app-fdroid-release.apk \
             "release-artifacts/marmalade-tts-${VERSION}-fdroid.apk"
          (cd release-artifacts && sha256sum *.aab *.apk > SHA256SUMS.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Marmalade TTS ${{ steps.stage.outputs.version }}
          generate_release_notes: true
          files: |
            release-artifacts/marmalade-tts-${{ steps.stage.outputs.version }}-play.aab
            release-artifacts/marmalade-tts-${{ steps.stage.outputs.version }}-play.apk
            release-artifacts/marmalade-tts-${{ steps.stage.outputs.version }}-fdroid.apk
            release-artifacts/SHA256SUMS.txt
